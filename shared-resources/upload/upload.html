<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传资源</title>
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/tabbar.css">
  <link rel="stylesheet" href="upload.css">
</head>
<body>
  <div class="container page-container">
    <!-- 头部 -->
    <div class="header gradient-bg">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 15px;">
        <span class="back-button" onclick="history.back()" style="font-size: 18px; color: white; cursor: pointer;">← 返回</span>
        <span class="header-title">📤 上传资源</span>
        <span style="width: 50px;"></span>
      </div>
      <span class="header-subtitle">分享优质教学资源，共建知识库</span>
    </div>

    <!-- 上传表单 -->
    <div class="form-card">
      <!-- 文件选择区域 -->
      <div class="form-section">
        <div class="section-label">选择文件 <span class="required">*</span></div>
        <div class="file-upload-area" id="fileUploadArea">
          <div id="filePlaceholder">
            <span class="upload-icon">📁</span>
            <span class="upload-text">点击选择文件</span>
            <span class="upload-hint">支持 PDF、Word、PPT、Excel 等格式</span>
          </div>
          <div class="selected-file" id="selectedFile" style="display: none;">
            <span class="file-icon" id="fileIcon">📄</span>
            <div class="file-info">
              <span class="file-name" id="fileName"></span>
              <span class="file-size" id="fileSize"></span>
            </div>
            <span class="remove-file" id="removeFile">✕</span>
          </div>
        </div>
      </div>

      <!-- 资源标题 -->
      <div class="form-section">
        <div class="section-label">资源标题 <span class="required">*</span></div>
        <input 
          class="form-input" 
          placeholder="请输入资源标题"
          id="titleInput"
          maxlength="100"
        />
      </div>

      <!-- 资源类型 -->
      <div class="form-section">
        <div class="section-label">资源类型 <span class="required">*</span></div>
        <div class="type-selector" id="typeSelector">
          <!-- 类型选项将通过JS动态生成 -->
        </div>
      </div>

      <!-- 学校名称 -->
      <div class="form-section">
        <div class="section-label">学校名称 <span class="required">*</span></div>
        <input 
          class="form-input" 
          placeholder="请输入学校名称，如：广东北江中学"
          id="schoolNameInput"
          maxlength="50"
        />
      </div>

      <!-- 上传者姓名 -->
      <div class="form-section">
        <div class="section-label">上传者姓名</div>
        <input 
          class="form-input" 
          placeholder="请输入您的姓名（选填）"
          id="uploaderNameInput"
          maxlength="20"
        />
      </div>

      <!-- 资源描述 -->
      <div class="form-section">
        <div class="section-label">资源描述</div>
        <textarea 
          class="form-textarea" 
          placeholder="请输入资源描述（选填）"
          id="descriptionInput"
          maxlength="500"
        ></textarea>
        <div class="char-count" id="charCount">0/500</div>
      </div>

      <!-- 上传进度 -->
      <div class="upload-progress" id="uploadProgress" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="progressText">上传中 0%</span>
      </div>

      <!-- 提交按钮 -->
      <button 
        class="submit-btn" 
        id="submitBtn"
        disabled
      >
        <span id="submitBtnText">确认上传</span>
      </button>
    </div>

    <!-- 上传提示 -->
    <div class="tips-card">
      <div class="tips-title">📋 上传须知</div>
      <div class="tip-item">
        <span class="tip-dot">•</span>
        <span class="tip-text">请确保上传的资源拥有合法版权或授权</span>
      </div>
      <div class="tip-item">
        <span class="tip-dot">•</span>
        <span class="tip-text">单个文件大小不超过 50MB</span>
      </div>
      <div class="tip-item">
        <span class="tip-dot">•</span>
        <span class="tip-text">禁止上传涉及违法违规内容</span>
      </div>
      <div class="tip-item">
        <span class="tip-dot">•</span>
        <span class="tip-text">优质资源将获得更多曝光和下载</span>
      </div>
    </div>
  </div>

  <script src="../../../js/supabase.js"></script>
  <script src="../../../js/components/tabbar.js"></script>
  <script src="upload.js"></script>
</body>
</html>
