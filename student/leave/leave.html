<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>请假申请</title>
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="./leave.css">
</head>
<body>
  <div class="container">
    <div class="loading-state" id="loadingState">
      <span class="loading-text">加载中...</span>
    </div>

    <div id="content" style="display: none;">
      <!-- 学生信息 -->
      <div class="student-header" id="studentHeader">
        <img class="header-avatar" id="headerAvatar" src="" alt="头像" style="display: none;"/>
        <div class="header-avatar-placeholder" id="headerAvatarPlaceholder">
          <span id="headerAvatarText">学</span>
        </div>
        <div class="header-info">
          <span class="header-name" id="headerName">-</span>
          <span class="header-class" id="headerClass">-</span>
        </div>
      </div>

      <!-- 请假表单 -->
      <div class="form-section">
        <div class="section-title">请假信息</div>
        
        <!-- 请假类型 -->
        <div class="form-item">
          <span class="form-label required">请假类型</span>
          <select class="form-select" id="leaveType">
            <option value="">请选择</option>
            <option value="sick">病假</option>
            <option value="personal">事假</option>
            <option value="other">其他</option>
          </select>
        </div>

        <!-- 开始时间 -->
        <div class="form-item">
          <span class="form-label required">开始时间</span>
          <input class="form-input" type="datetime-local" id="startTime"/>
        </div>

        <!-- 结束时间 -->
        <div class="form-item">
          <span class="form-label required">结束时间</span>
          <input class="form-input" type="datetime-local" id="endTime"/>
        </div>

        <!-- 请假天数 -->
        <div class="form-item">
          <span class="form-label">请假天数</span>
          <span class="day-count" id="dayCount">0 天</span>
        </div>
      </div>

      <!-- 请假事由 -->
      <div class="form-section">
        <div class="section-title">请假事由</div>
        <div class="form-item textarea-item">
          <textarea 
            class="form-textarea" 
            placeholder="请输入请假事由，详细说明请假原因..."
            id="leaveReason"
            maxlength="200"
          ></textarea>
          <span class="textarea-count" id="textareaCount">0/200</span>
        </div>
      </div>

      <!-- 提交按钮 -->
      <div class="action-section">
        <button class="submit-btn" id="submitBtn">提交申请</button>
      </div>

      <!-- 历史记录 -->
      <div class="history-section">
        <div class="section-title">历史请假记录</div>
        <div class="history-list" id="historyList">
          <!-- 动态生成 -->
        </div>
      </div>
    </div>
  </div>

  <script src="../../../js/supabase.js"></script>
  <script src="../../../js/utils.js"></script>
  <script src="./leave.js"></script>
</body>
</html>
